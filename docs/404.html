<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Accurivo — vienkārša grāmatvedība mazam uzņēmumam</title>
  <meta name="description" content="My Accurivo — vienkārša aprēķinu, krājumu un maksājumu programma maziem uzņēmumiem. Darbojas Windows datorā, bez interneta. Jūsu dati paliek pie jums.">
  <link rel="canonical" href="https://myaccurivo.com/">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="My Accurivo">
  <meta property="og:title" content="My Accurivo — vienkārša grāmatvedība mazam uzņēmumam">
  <meta property="og:description" content="Rēķini, piedāvājumi, krājumi (PPD), CMR, maksājumi un statistika — vienā mazā Windows programmā. Bez interneta, jūsu dati paliek jūsu datorā.">
  <meta property="og:url" content="https://myaccurivo.com/">
  <meta property="og:locale" content="lv_LV">
  <meta property="og:locale:alternate" content="en">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Cpath d='M9 22h14M10 10h12M16 10v12' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='22' r='2.4' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="aura" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>
  <header class="nav">
    <a class="brand" href="./"><svg width="30" height="30" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#0f766e"/><path d="M9 22h14M10 10h12M16 10v12" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="23" cy="22" r="2.4" fill="#fff"/></svg><span>My&nbsp;Accurivo</span></a>
    <nav>
      <a href="#features" data-t="nav.features"></a>
      <a href="#how" data-t="nav.how"></a>
      <a href="#faq" data-t="nav.faq"></a>
      <a href="#contact" data-t="nav.contact"></a>
      <a href="#download" class="btn small" data-t="nav.download"></a>
      <button id="langBtn" class="lang" type="button">EN</button>
    </nav>
  </header>

  <section class="hero">
    <div class="wrap">
      <h1><span data-t="hero.title"></span></h1>
      <p class="lead" data-t="hero.lead"></p>
      <div class="cta">
        <a class="btn big" id="dlMain" href="https://github.com/circuitsorceryapp-ui/myaccurivo/releases/latest/download/accurivo.exe" data-t="hero.btn"></a>
        <span class="muted" data-t="hero.note"></span>
      </div>
      <div class="hero-points">
        <div data-t="hero.p1"></div>
        <div data-t="hero.p2"></div>
        <div data-t="hero.p3"></div>
      </div>
      <div class="shot">
        <div class="shot-bar"><i></i><i></i><i></i></div>
        <div class="shot-body">
          <div class="shot-side">
            <div class="shot-brand">My Accurivo</div>
            <div class="shot-i active" data-t="shot.dashboard"></div>
            <div class="shot-i" data-t="shot.docs"></div>
            <div class="shot-i" data-t="shot.stock"></div>
            <div class="shot-i" data-t="shot.stats"></div>
          </div>
          <div class="shot-main">
            <div class="shot-cards">
              <div class="shot-card"><small data-t="stats.realization"></small><b>€ 12 480</b></div>
              <div class="shot-card green"><small data-t="stats.profit"></small><b>€ 4 192</b></div>
              <div class="shot-card"><small data-t="stats.saldo"></small><b>€ 6 310</b></div>
              <div class="shot-card red"><small data-t="stats.overdue"></small><b>€ 845</b></div>
            </div>
            <svg viewBox="0 0 520 150" class="shot-chart" aria-hidden="true">
              <g fill="#0f766e">
                <rect x="20" y="70" width="18" height="60" rx="3"/><rect x="70" y="45" width="18" height="85" rx="3"/>
                <rect x="120" y="85" width="18" height="45" rx="3"/><rect x="170" y="30" width="18" height="100" rx="3"/>
                <rect x="220" y="60" width="18" height="70" rx="3"/><rect x="270" y="40" width="18" height="90" rx="3"/>
                <rect x="320" y="75" width="18" height="55" rx="3"/><rect x="370" y="25" width="18" height="105" rx="3"/>
              </g>
              <g fill="#c9ded9">
                <rect x="42" y="105" width="18" height="25" rx="3"/><rect x="92" y="95" width="18" height="35" rx="3"/>
                <rect x="142" y="112" width="18" height="18" rx="3"/><rect x="192" y="100" width="18" height="30" rx="3"/>
                <rect x="242" y="110" width="18" height="20" rx="3"/><rect x="292" y="98" width="18" height="32" rx="3"/>
                <rect x="342" y="115" width="18" height="15" rx="3"/><rect x="392" y="104" width="18" height="26" rx="3"/>
              </g>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="features" class="sec alt reveal">
    <div class="wrap">
      <h2 data-t="features.title"></h2>
      <div class="grid">
        <div class="feat wide reveal"><h3 data-t="f1.t"></h3><p data-t="f1.d"></p></div>
        <div class="feat reveal"><h3 data-t="f2.t"></h3><p data-t="f2.d"></p></div>
        <div class="feat reveal"><h3 data-t="f3.t"></h3><p data-t="f3.d"></p></div>
        <div class="feat reveal"><h3 data-t="f4.t"></h3><p data-t="f4.d"></p></div>
        <div class="feat reveal"><h3 data-t="f5.t"></h3><p data-t="f5.d"></p></div>
        <div class="feat wide reveal"><h3 data-t="f6.t"></h3><p data-t="f6.d"></p></div>
        <div class="feat reveal"><h3 data-t="f7.t"></h3><p data-t="f7.d"></p></div>
        <div class="feat reveal"><h3 data-t="f8.t"></h3><p data-t="f8.d"></p></div>
      </div>
    </div>
  </section>

  <section id="how" class="sec reveal">
    <div class="wrap">
      <h2 data-t="how.title"></h2>
      <div class="steps reveal">
        <div class="step"><div class="num">1</div><h3 data-t="s1.t"></h3><p data-t="s1.d"></p></div>
        <div class="step"><div class="num">2</div><h3 data-t="s2.t"></h3><p data-t="s2.d"></p></div>
        <div class="step"><div class="num">3</div><h3 data-t="s3.t"></h3><p data-t="s3.d"></p></div>
      </div>
    </div>
  </section>

  <section id="download" class="sec alt reveal">
    <div class="wrap center">
      <h2 data-t="dl.title"></h2>
      <p class="lead" data-t="dl.lead"></p>
      <a class="btn big" href="https://github.com/circuitsorceryapp-ui/myaccurivo/releases/latest/download/accurivo.exe">accurivo.exe — Windows</a>
      <p class="muted small" data-t="dl.note"></p>
      <div class="reqs reveal">
        <div class="req"><b data-t="req.os.t"></b><span data-t="req.os.d"></span></div>
        <div class="req"><b data-t="req.disk.t"></b><span data-t="req.disk.d"></span></div>
        <div class="req"><b data-t="req.net.t"></b><span data-t="req.net.d"></span></div>
        <div class="req"><b data-t="req.lang.t"></b><span data-t="req.lang.d"></span></div>
      </div>
      <div class="whatsnew reveal">
        <h3 data-t="new.title"></h3>
        <ul>
          <li data-t="new.1"></li>
          <li data-t="new.2"></li>
          <li data-t="new.3"></li>
          <li data-t="new.4"></li>
          <li data-t="new.5"></li>
        </ul>
      </div>
    </div>
  </section>

  <section id="contact" class="sec reveal">
    <div class="wrap narrow center">
      <h2 data-t="ct.title"></h2>
      <p class="lead" data-t="ct.lead"></p>
      <a class="btn" href="mailto:info@myaccurivo.net">info@myaccurivo.net</a>
    </div>
  </section>

  <section id="faq" class="sec reveal">
    <div class="wrap narrow">
      <h2 data-t="faq.title"></h2>
      <details><summary data-t="q1.t"></summary><p data-t="q1.d"></p></details>
      <details><summary data-t="q2.t"></summary><p data-t="q2.d"></p></details>
      <details><summary data-t="q3.t"></summary><p data-t="q3.d"></p></details>
      <details><summary data-t="q4.t"></summary><p data-t="q4.d"></p></details>
    </div>
  </section>

  <footer>
    <div class="wrap">
      <div>My Accurivo · <span data-t="foot.tag"></span></div>
      <div class="muted small">© 2026 myaccurivo.net</div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
